name: Bug report
description: The app doesn't start, crashes, or something in PICO-8 misbehaves.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing! The log is the most useful thing you can send:
        it is at `/data/pico8/loader.log` on the PS5 (copy it over FTP).
        For security problems, use the private report link in SECURITY.md instead.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you saw (notification text, black screen, crash...).
    validations:
      required: true
  - type: input
    id: release
    attributes:
      label: App release
      placeholder: v0.1.1
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: PS5 firmware
      placeholder: e.g. 4.03
    validations:
      required: true
  - type: input
    id: pico8
    attributes:
      label: PICO-8 version
      description: The version of your pico8_dyn (0.2.7 is the tested one).
      placeholder: 0.2.7
    validations:
      required: true
  - type: dropdown
    id: location
    attributes:
      label: Where is the app folder?
      options:
        - /data/homebrew
        - USB drive
        - Other
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: loader.log
      description: Paste the full contents of /data/pico8/loader.log (or attach the file).
      render: text
    validations:
      required: true
